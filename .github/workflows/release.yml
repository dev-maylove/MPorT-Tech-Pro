name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.1.0). Leave empty to use tag or default 1.0.0'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Signed Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version from tag / input
        id: version
        run: |
          # Prefer manual input, then git tag, then fallback
          RAW="${{ github.event.inputs.version_name }}"
          if [ -z "$RAW" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$RAW" ]; then
            RAW="1.0.0"
          fi
          # Strip any remaining leading 'v'
          VERSION_NAME="${RAW#v}"
          # Basic semver validation (major.minor.patch, optional pre-release)
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION_NAME'. Expected like 1.2.3 or 1.2.3-rc1"
            exit 1
          fi
          # versionCode = major*10000 + minor*100 + patch  (e.g. 1.2.3 → 10203)
          MAJOR=$(echo "$VERSION_NAME" | cut -d. -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d. -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d. -f3 | sed 's/[^0-9].*//')
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$VERSION_NAME  versionCode=$VERSION_CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true
          cache: gradle

      - name: Set up Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. Create a base64-encoded keystore and store it as a repository secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
          echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
          ls -la "${{ github.workspace }}/release.keystore"

      - name: Build signed Release APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing one of KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets."
            exit 1
          fi
          gradle :app:assembleRelease :app:bundleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            --stacktrace --no-daemon

      - name: Rename & stage artifacts
        id: artifacts
        run: |
          VERSION="${{ steps.version.outputs.version_name }}"
          mkdir -p dist
          # APK (archivesBaseName already sets MPorT-Tech-Pro-vX.Y.Z-release.apk)
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found"
            exit 1
          fi
          APK_NAME="MPorT-Tech-Pro-v${VERSION}.apk"
          cp "$APK" "dist/${APK_NAME}"
          echo "apk_path=dist/${APK_NAME}" >> "$GITHUB_OUTPUT"
          # AAB
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::No release AAB found"
            exit 1
          fi
          AAB_NAME="MPorT-Tech-Pro-v${VERSION}.aab"
          cp "$AAB" "dist/${AAB_NAME}"
          echo "aab_path=dist/${AAB_NAME}" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: MPorT-Tech-Pro-v${{ steps.version.outputs.version_name }}-APK
          path: ${{ steps.artifacts.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v6
        with:
          name: MPorT-Tech-Pro-v${{ steps.version.outputs.version_name }}-AAB
          path: ${{ steps.artifacts.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MPorT Tech Pro v${{ steps.version.outputs.version_name }}
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            ${{ steps.artifacts.outputs.aab_path }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore"
