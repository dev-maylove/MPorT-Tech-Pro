name: Android Release

# Auto-run when project is pushed (e.g. from Termux) + tags + manual
on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version label, e.g. 2.0.1'
        required: true
        type: string
        default: '2.0.1'
      api_base_url:
        description: 'Production API base URL'
        required: false
        type: string
        default: 'https://api.mandalanet.id'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Signed Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version from tag / input / push
        id: version
        run: |
          RAW="${{ github.event.inputs.version_name }}"
          if [ -z "$RAW" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$RAW" ]; then
            # Auto version from date + short SHA (Termux / normal push)
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            RAW="1.0.$(date -u +%y%m%d)-${SHORT_SHA}"
          fi
          VERSION_NAME="${RAW#v}"
          # versionCode: monotonic-ish from date YYYYMMDDHH (fits int)
          VERSION_CODE=$(date -u +%y%m%d%H)
          # Prefer numeric from semver when available
          if [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            # Avoid collision on same patch: append hour
            if [[ "${{ github.ref }}" != refs/tags/* ]]; then
              VERSION_CODE=$((VERSION_CODE * 100 + 10#$(date -u +%H)))
            fi
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$VERSION_NAME  versionCode=$VERSION_CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. Add it in repo Settings → Secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
          ls -la "${{ github.workspace }}/release.keystore"

      - name: Build signed Release APK + AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets."
            exit 1
          fi
          # Normalize API URL (ensure trailing slash)
          API_URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://api.mandalanet.id"
          fi
          case "$API_URL" in
            */) ;;
            *) API_URL="${API_URL}/" ;;
          esac
          echo "Using API_BASE_URL=$API_URL"
          gradle :app:assembleRelease :app:bundleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            -PapiBaseUrl="$API_URL" \
            --stacktrace --no-daemon

      - name: Rename & stage artifacts
        id: artifacts
        run: |
          VERSION="${{ steps.version.outputs.version_name }}"
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found"
            exit 1
          fi
          APK_NAME="MPorT-Tech-Pro-v${VERSION}.apk"
          cp "$APK" "dist/${APK_NAME}"
          echo "apk_path=dist/${APK_NAME}" >> "$GITHUB_OUTPUT"
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::No release AAB found"
            exit 1
          fi
          AAB_NAME="MPorT-Tech-Pro-v${VERSION}.aab"
          cp "$AAB" "dist/${AAB_NAME}"
          echo "aab_path=dist/${AAB_NAME}" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: MPorT-Tech-Pro-v${{ steps.version.outputs.version_name }}-APK
          path: ${{ steps.artifacts.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v7
        with:
          name: MPorT-Tech-Pro-v${{ steps.version.outputs.version_name }}-AAB
          path: ${{ steps.artifacts.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: MPorT Tech Pro v${{ steps.version.outputs.version_name }}
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            ${{ steps.artifacts.outputs.aab_path }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore"
